services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build: ./server
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379/0
      - BUCKET_TZ=America/New_York
      - RETENTION_DAYS=7
      - ALLOW_DEV_IP_OVERRIDE=true
      - DEV_CORS=true
    ports:
      - "0.0.0.0:8081:8080"
    depends_on:
      - redis

  web:
    build: ./web
    ports:
      - "0.0.0.0:3001:80"
    depends_on:
      - server
